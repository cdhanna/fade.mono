name: Steam (Fish Fish Pop)

# Builds the fish game (Fade.MonoGame/) for Windows and macOS and uploads both to Steam.
# Run by hand: Actions -> Steam (Fish Fish Pop) -> Run workflow.
#
# One-time setup, and every value that has to be swapped in, is in steam/SETUP.md.
#
# Repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables).
# Secrets of the same names are accepted too; the ids are then masked in the logs.
#   STEAM_APP_ID          the app id
#   STEAM_DEPOT_WINDOWS   the Windows depot id
#   STEAM_DEPOT_MAC       the macOS depot id
#
# Repository SECRETS:
#   STEAM_USERNAME          login name of the Steam builder account
#   STEAM_CONFIG_VDF        base64 of that account's steamcmd config.vdf
#   CLOUDFLARE_API_TOKEN    R2 token, Object Read only
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account the bucket lives in
#   STEAM_PUBLISHER_KEY     optional: publisher Web API key, for set_live = default
#   FISH_SCORE_KEY          the secret that leaderboard scores are checked with. letters and
#                           digits only. required to deploy. see "Leaderboards" in SETUP.md.

on:
  workflow_dispatch:
    inputs:
      set_live:
        description: 'Steam branch to set the build live on. "default" is what every player gets; it needs the STEAM_PUBLISHER_KEY secret, and without it the build is uploaded and you set it live by hand. "none" uploads without setting anything live.'
        type: choice
        required: false
        default: test
        options:
          - test
          - default
          - none
      deploy:
        description: 'Upload to Steam. Untick to only build: the two builds are then attached to the run as artifacts, and no Steam secret is needed.'
        type: boolean
        required: false
        default: true

concurrency:
  group: steam-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GAME_PROJECT: Fade.MonoGame/Fade.MonoGame.csproj
  # The executable `dotnet publish` produces: the assembly name. The Windows launch option in
  # Steamworks is "<EXE_NAME>.exe".
  EXE_NAME: Fade.MonoGame
  # The macOS bundle is "<APP_NAME>.app", which is the macOS launch option in Steamworks.
  APP_NAME: FishFishPop
  DISPLAY_NAME: Fish Fish Pop

  # NOTE: the graphics backend is OpenGL (MonoGame DesktopGL), which is what
  # $(FadeMonoGamePlatform) defaults to and what the game's shaders are written for. OpenGL
  # shaders compile through MGFXC, which shells out to the Windows fxc.exe, hence the Wine
  # step below. -p:FadeEngineShaderVariants=Desktop on both publishes stops the engine from
  # also baking a Vulkan variant of its sprite shader that this game never loads.

jobs:
  build:
    # ONE Linux runner produces both platforms. `dotnet publish -r <rid> --self-contained`
    # cross-builds, the macOS bundle is assembled by a shell script, and Linux keeps the
    # executable bit on the macOS binary, which a Windows runner would lose.
    name: build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before the slow part, so a missing id costs seconds and not a whole build.
      - name: Require Steam ids and credentials
        if: inputs.deploy
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID || secrets.STEAM_APP_ID }}
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS || secrets.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_MAC: ${{ vars.STEAM_DEPOT_MAC || secrets.STEAM_DEPOT_MAC }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          FISH_SCORE_KEY: ${{ secrets.FISH_SCORE_KEY }}
        run: |
          fail=0
          # Without the key the build would use the dev leaderboards, with a key that is in
          # the source. That must not go out to players.
          if ! [[ "$FISH_SCORE_KEY" =~ ^[A-Za-z0-9]{16,}$ ]]; then
            echo "::error::FISH_SCORE_KEY must be set as a repository secret: 16 or more letters and digits. See steam/SETUP.md."
            fail=1
          fi
          for name in STEAM_APP_ID STEAM_DEPOT_WINDOWS STEAM_DEPOT_MAC; do
            if ! [[ "${!name}" =~ ^[0-9]+$ ]]; then
              echo "::error::Repository variable $name is not set to a number. See steam/SETUP.md."
              fail=1
            fi
          done
          if [ -z "$STEAM_CONFIG_VDF" ] || [ -z "$STEAM_USERNAME" ]; then
            echo "::error::STEAM_USERNAME and STEAM_CONFIG_VDF must be set as repository secrets. See steam/SETUP.md."
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-steam-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            nuget-steam-${{ runner.os }}-

      # The textures, audio and fonts live in Cloudflare R2, not git. build/assets.lock pins
      # the exact bundle this commit builds against, so CI compiles the same bytes the author
      # pushed. Must run before any dotnet build: the game's CheckBucketAssets target fails
      # the build outright when the folders are missing.
      - name: Fetch bucket assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets. See steam/SETUP.md."
            exit 1
          fi
          bash build/fetch-assets.sh

      # Fade.MonoGame.Steam references Facepunch.Steamworks by source, from External/, which is
      # not in git. build/steamworks.lock pins the commit. It also carries the macOS Steam
      # library that goes into the bundle. Must run before any dotnet build: restore fails on
      # the missing project.
      - name: Fetch Facepunch.Steamworks
        run: bash build/fetch-steamworks.sh

      # Same setup as ci.yml. See https://docs.monogame.net/errors/mgfx0001?tab=linux
      - name: Setup Wine for MGFXC (shader compilation)
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64
          wget -qO- https://monogame.net/downloads/net8_mgfxc_wine_setup.sh | bash
          echo "MGFXC_WINE_PATH=$HOME/.winemonogame" >> "$GITHUB_ENV"

      - name: Publish win-x64
        env:
          # Both are read by Fade.MonoGame.csproj, which bakes them into the game: the
          # leaderboards are the ones of this Steam branch, and scores are checked with the
          # secret and the branch together. Without the secret, the "dev_" ones are used.
          FISH_SCORE_KEY: ${{ secrets.FISH_SCORE_KEY }}
          FISH_DEPLOY_BRANCH: ${{ inputs.set_live || 'test' }}
        run: |
          dotnet publish "$GAME_PROJECT" \
            -c Release \
            -p:FadeEngineShaderVariants=Desktop \
            -r win-x64 \
            --self-contained true \
            -o publish/win-x64

      # Apple Silicon only. An Intel Mac would need a second publish (-r osx-x64) and its
      # own bundle.
      - name: Publish osx-arm64
        env:
          # Both are read by Fade.MonoGame.csproj, which bakes them into the game: the
          # leaderboards are the ones of this Steam branch, and scores are checked with the
          # secret and the branch together. Without the secret, the "dev_" ones are used.
          FISH_SCORE_KEY: ${{ secrets.FISH_SCORE_KEY }}
          FISH_DEPLOY_BRANCH: ${{ inputs.set_live || 'test' }}
        run: |
          dotnet publish "$GAME_PROJECT" \
            -c Release \
            -p:FadeEngineShaderVariants=Desktop \
            -r osx-arm64 \
            --self-contained true \
            -o publish/osx-arm64

      # A publish that leaves these out still succeeds, and produces a game that dies at
      # launch. The payload itself is the evidence.
      - name: Verify the payloads
        run: |
          fail=0
          need() {
            if [ -z "$(find "$1" -maxdepth 1 -iname "$2" -print -quit)" ]; then
              echo "::error::$1 has no $2"
              fail=1
            fi
          }
          need publish/win-x64   "$EXE_NAME.exe"
          need publish/win-x64   'MonoGame.Framework.dll'
          need publish/win-x64   'SDL2.dll'
          need publish/osx-arm64 "$EXE_NAME"
          need publish/osx-arm64 'MonoGame.Framework.dll'
          need publish/osx-arm64 'libSDL2*.dylib'
          # Steam. Each platform needs its own interop assembly AND its own native library:
          # the Windows pair in a macOS build, or the other way round, fails on the first
          # Steam call and not before.
          need publish/win-x64   'Facepunch.Steamworks.Win64.dll'
          need publish/win-x64   'steam_api64.dll'
          need publish/osx-arm64 'Facepunch.Steamworks.Posix.dll'
          need publish/osx-arm64 'libsteam_api.dylib'
          # steam_appid.txt lets the game start without a license. It is not in git, so it
          # should never be here, and this is what makes sure.
          if [ -n "$(find publish -name steam_appid.txt -print -quit)" ]; then
            echo "::error::steam_appid.txt is in the publish output. It must not reach a depot."
            fail=1
          fi
          for rid in win-x64 osx-arm64; do
            count=$(find "publish/$rid/Content" -name '*.xnb' 2>/dev/null | wc -l)
            echo "$rid: $count content files"
            if [ "$count" -lt 20 ]; then
              echo "::error::publish/$rid/Content has $count .xnb files; the content build produced next to nothing"
              fail=1
            fi
            # One of each kind that comes from the bucket, so a bundle that is missing a
            # whole folder cannot upload.
            for probe in 'Fish/Textures/Goldfish.xnb' 'Fish/Fonts/ZeroCool.xnb' 'Fish/Audio/bubble-pop-2.xnb' 'Fish/Shaders/FishEffect.xnb'; do
              if [ ! -f "publish/$rid/Content/$probe" ]; then
                echo "::error::publish/$rid/Content/$probe is missing"
                fail=1
              fi
            done
          done
          [ "$fail" = "0" ] || exit 1

      # arm64 macOS SIGKILLs an unsigned binary. `codesign` does not exist here, hence the
      # Mach-O parser.
      - name: Verify the macOS apphost is signed
        run: python3 build/check-macho-signed.py "publish/osx-arm64/$EXE_NAME"

      - name: Stage Windows payload
        run: |
          mkdir -p steam/content/windows
          cp -R publish/win-x64/. steam/content/windows/
          find steam/content/windows -maxdepth 1 \( -name '*.pdb' -o -name '_lastRun.log' \) -delete

      # Steam's macOS launch option needs a .app.
      - name: Package macOS app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p steam/content/mac
          bash build/make-macos-app.sh publish/osx-arm64 steam/content/mac
          APP="steam/content/mac/$APP_NAME.app"
          test -x "$APP/Contents/MacOS/$EXE_NAME" \
            || { echo "::error::macOS executable lost its +x bit"; exit 1; }
          # A bundled game only sees content in Contents/Resources.
          test -f "$APP/Contents/Resources/Content/Fish/Textures/Goldfish.xnb" \
            || { echo "::error::macOS bundle has no content in Contents/Resources/Content"; exit 1; }
          test ! -d "$APP/Contents/MacOS/Content" \
            || { echo "::error::Content staged in Contents/MacOS -- a bundled app cannot see it"; exit 1; }

      # Build-only runs: hand the two builds over as artifacts instead. Tarred, because the
      # artifact zip would strip the executable bit from the macOS bundle.
      - name: Pack builds for download
        if: ${{ !inputs.deploy }}
        run: |
          mkdir -p artifacts-out
          ( cd steam/content/windows && zip -qr "$GITHUB_WORKSPACE/artifacts-out/$APP_NAME-windows-x64.zip" . )
          tar -czf "artifacts-out/$APP_NAME-macos-arm64.tar.gz" -C steam/content/mac "$APP_NAME.app"

      - name: Upload builds as artifacts
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v4
        with:
          name: fishfishpop-builds
          path: artifacts-out/
          retention-days: 7
          compression-level: 0

      - name: Install steamcmd
        if: inputs.deploy
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 lib32stdc++6
          mkdir -p "$HOME/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$HOME/steamcmd"
          # First run bootstraps and self-updates; it exits non-zero by design.
          "$HOME/steamcmd/steamcmd.sh" +quit || true

      - name: Restore Steam login
        if: inputs.deploy
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          # The tarball build of steamcmd roots itself at ~/Steam, while the Debian package
          # uses ~/.local/share/Steam. Write both so a layout change can't silently turn
          # into an auth failure.
          for dir in "$HOME/Steam/config" "$HOME/.local/share/Steam/config"; do
            mkdir -p "$dir"
            echo "$STEAM_CONFIG_VDF" | base64 -d > "$dir/config.vdf"
            chmod 600 "$dir/config.vdf"
          done
          test -s "$HOME/Steam/config/config.vdf" \
            || { echo "::error::STEAM_CONFIG_VDF did not base64-decode to anything"; exit 1; }

      - name: Upload build to Steam
        if: inputs.deploy
        id: steam_upload
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID || secrets.STEAM_APP_ID }}
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS || secrets.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_MAC: ${{ vars.STEAM_DEPOT_MAC || secrets.STEAM_DEPOT_MAC }}
          # Passed through env rather than inlined into the script, to keep the input out
          # of the shell it would otherwise be interpolated into.
          SET_LIVE: ${{ inputs.set_live || 'test' }}
          # Optional. A Steamworks publisher Web API key, used only to set a build live on
          # the default branch.
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
        run: |
          # "none" is the sentinel for "don't set live" -- an empty workflow input can't be
          # distinguished from an absent one.
          if [ "$SET_LIVE" = "none" ]; then SET_LIVE=""; fi
          if ! [[ "$SET_LIVE" =~ ^[A-Za-z0-9_.-]*$ ]]; then
            echo "::error::set_live must be a Steam branch name (letters, digits, - _ .) or \"none\""
            exit 1
          fi
          # Steam does not let a build script set the default branch live, and it does not
          # fail gently: with "setlive" "default" the whole commit is rejected ("Failed to
          # commit build ... Failure") and no build is created at all. So "default" uploads
          # the build with nothing set live, and then promotes it through the Steamworks
          # Web API (ISteamApps/SetAppBuildLive), which is allowed to. That needs the
          # STEAM_PUBLISHER_KEY secret; without it the last click is done by hand.
          PROMOTE_DEFAULT=0
          if [ "$SET_LIVE" = "default" ]; then
            SET_LIVE=""
            PROMOTE_DEFAULT=1
          fi
          echo "setlive target: '${SET_LIVE:-<none>}'"

          # pipefail: steamcmd is piped through tee below, and without this a failed upload
          # would take tee's exit code and read as a success.
          set -o pipefail

          DESC="${GITHUB_REF_NAME//[^A-Za-z0-9_.\/-]/_} ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_NUMBER})"
          sed -i \
            -e "s|__APP_ID__|${STEAM_APP_ID}|g" \
            -e "s|__DEPOT_WINDOWS__|${STEAM_DEPOT_WINDOWS}|g" \
            -e "s|__DEPOT_MAC__|${STEAM_DEPOT_MAC}|g" \
            -e "s|__DESC__|${DESC}|g" \
            -e "s|__SETLIVE__|${SET_LIVE}|g" \
            steam/app_build.vdf steam/depot_windows.vdf steam/depot_mac.vdf

          "$HOME/steamcmd/steamcmd.sh" \
            +login "$STEAM_USERNAME" \
            +run_app_build "$GITHUB_WORKSPACE/steam/app_build.vdf" \
            +quit | tee "$RUNNER_TEMP/steamcmd.log"

          # Say where the build ended up on every run, so that a run that went to "test" cannot
          # be mistaken for a release. The default branch has its own messages below.
          if [ "$PROMOTE_DEFAULT" != "1" ]; then
            if [ -n "$SET_LIVE" ]; then
              echo "::notice::Build \"${DESC}\" is live on the \"${SET_LIVE}\" branch only. Players on the default branch did NOT get it: for that, run again with set_live = default."
            else
              echo "::notice::Build \"${DESC}\" is uploaded and not live on any branch."
            fi
          fi

          if [ "$PROMOTE_DEFAULT" = "1" ]; then
            BUILDS_PAGE="https://partner.steamgames.com/apps/builds/${STEAM_APP_ID}"
            # steamcmd ends a good upload with "... build (BuildID 1234567)".
            BUILD_ID=$(grep -oE 'BuildID [0-9]+' "$RUNNER_TEMP/steamcmd.log" | tail -1 | grep -oE '[0-9]+' || true)
            if [ -z "$STEAM_PUBLISHER_KEY" ]; then
              echo "::notice::Build \"${DESC}\" is uploaded but NOT live. Set it live on default at ${BUILDS_PAGE}, or add the STEAM_PUBLISHER_KEY secret to have this done for you (see steam/SETUP.md)."
            elif [ -z "$BUILD_ID" ]; then
              echo "::error::Uploaded, but could not read the BuildID from the steamcmd output, so nothing was set live. Set the build live on default at ${BUILDS_PAGE}."
              exit 1
            else
              # "public" is what the Web API calls the default branch.
              HTTP=$(curl -sS -o "$RUNNER_TEMP/setlive.json" -w '%{http_code}' -X POST \
                "https://partner.steam-api.com/ISteamApps/SetAppBuildLive/v2/" \
                --data-urlencode "key=${STEAM_PUBLISHER_KEY}" \
                --data-urlencode "appid=${STEAM_APP_ID}" \
                --data-urlencode "buildid=${BUILD_ID}" \
                --data-urlencode "betakey=public" \
                --data-urlencode "description=${DESC}")
              echo "SetAppBuildLive: HTTP ${HTTP}"; cat "$RUNNER_TEMP/setlive.json" || true; echo
              if [ "$HTTP" != "200" ]; then
                echo "::error::The build is uploaded (BuildID ${BUILD_ID}) but Steam refused to set it live on default (HTTP ${HTTP}). Set it live by hand at ${BUILDS_PAGE}."
                exit 1
              fi
              echo "::notice::Build ${BUILD_ID} \"${DESC}\" is live on the default branch."
            fi
          fi

      - name: Dump SteamPipe logs on failure
        if: failure() && steps.steam_upload.outcome == 'failure'
        run: |
          for f in steam/output/*.log "$HOME"/Steam/logs/*.txt; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done || true
